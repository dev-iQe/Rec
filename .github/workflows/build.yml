name: Build iCerf IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App & Export IPA
      run: |
        xcodebuild -project iCerf.xcodeproj \
                   -scheme iCerf \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO

        mkdir -p Payload
        cp -R build/Build/Products/Release-iphoneos/iCerf.app Payload/
        zip -r iCerf.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: iCerf-IPA
        path: iCerf.ipa
